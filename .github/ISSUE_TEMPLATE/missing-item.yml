name: Missing research candidate
description: Quickly report a candidate that should be considered.
title: "[Missing Candidate Name]"
labels:
  - needs:triage
body:
  - type: markdown
    attributes:
      value: |
        Report anything that may belong in the research workflow: a platform, framework, module, initiative, or boundary case.

  - type: input
    id: candidate-link
    attributes:
      label: Link
      description: Canonical or best available source link.
      placeholder: https://example.org/
    validations:
      required: true

  - type: checkboxes
    id: candidate-kind
    attributes:
      label: Kind
      description: Optional. Select the kind if you know it; leave all empty when unknown.
      options:
        - label: platform
        - label: framework
        - label: module
        - label: initiative
