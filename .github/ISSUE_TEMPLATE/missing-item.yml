name: Missing research candidate
description: Quickly report a candidate that should be considered.
title: "[Missing] "
labels:
  - needs:triage
body:
  - type: markdown
    attributes:
      value: |
        Report anything that may belong in the research workflow: a platform, framework, module, initiative, or boundary case.

  - type: input
    id: candidate-name
    attributes:
      label: Name
      description: Candidate name.
      placeholder: Example Platform
    validations:
      required: true

  - type: input
    id: candidate-link
    attributes:
      label: Link
      description: Canonical or best available source link.
      placeholder: https://example.org/
    validations:
      required: true

  - type: checkboxes
    id: research-tags
    attributes:
      label: Research tags
      description: Optional. Select any tags that help triage the report quickly.
      options:
        - label: recall-miss - candidate appears in scope but was not found by a discovery run.
        - label: model-specific - behavior differs across model outputs or runners.
        - label: wording - prompt, spec, or documentation wording may have caused confusion.
        - label: classification - candidate was found but its Type may be wrong.
        - label: boundary - candidate is near an inclusion or exclusion boundary.
        - label: benchmark - finding should be tracked through recall benchmark or coverage checks.
        - label: accepted - human review accepted the candidate or finding.
        - label: needs-review - needs human or spec review before action.

  - type: textarea
    id: model-notes
    attributes:
      label: Model notes
      description: Optional. Paste the model's own answer about why it missed this candidate.
      placeholder: The model said it missed the candidate because...
    validations:
      required: false
