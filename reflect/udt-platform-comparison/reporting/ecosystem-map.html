<style>
:root { --bg:#f6f4ee; --fg:#1f2937; --muted:#6b7280; --line:#d6d3d1; --panel:#fffdf8; --accent:#0f766e; }
body { margin:0; font-family: Georgia, "Times New Roman", serif; background:linear-gradient(180deg,#f6f4ee,#efece3); color:var(--fg); }
main { max-width:1200px; margin:0 auto; padding:32px 20px 48px; }
h1 { margin:0 0 8px; font-size:2rem; }
p { color:var(--muted); max-width:75ch; }
.controls, .summary, .table-wrap { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 8px 24px rgba(0,0,0,.04); }
.controls { display:flex; gap:16px; align-items:end; flex-wrap:wrap; margin:20px 0; }
label { display:flex; flex-direction:column; gap:6px; font-size:.9rem; color:var(--muted); }
select { min-width:220px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:white; }
.summary { margin:20px 0; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:12px; }
.metric { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; }
.metric-head { display:flex; justify-content:space-between; gap:10px; font-size:.95rem; }
.bar { height:10px; background:#e7e5e4; border-radius:999px; margin-top:8px; overflow:hidden; }
.bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),#38bdf8); }
.table-wrap { overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { padding:10px 12px; border-bottom:1px solid #ece7df; text-align:left; white-space:nowrap; }
th { position:sticky; top:0; background:#faf8f2; }
td.num { text-align:center; font-variant-numeric:tabular-nums; }
a { color:var(--accent); }
.small { font-size:.85rem; color:var(--muted); }
</style>
</head>

  <section class="table-wrap">

    </table>
  </section>

"Open":"1","Sim":"5","Std":"3","Viz":"5"}];
const metrics = ["Arch","Open","City","Mature","Integ","Gov","Viz","DM","Sim","IoT","Std","Infra"];
const columns = ["Name","Link", ...metrics, "Model", "Date"];
const select = document.getElementById("model-filter");
const countEl = document.getElementById("counts");
const summaryGrid = document.getElementById("summary-grid");
const headRow = document.getElementById("head-row");
const bodyRows = document.getElementById("body-rows");
for (const col of columns) {
  const th = document.createElement("th");
  th.textContent = col;
  headRow.appendChild(th);
}
for (const model of [...new Set(rows.map((r) => r.Model))]) {
  const opt = document.createElement("option");
  opt.value = model;
  opt.textContent = model;
  select.appendChild(opt);
}
function filteredRows() {
  const model = select.value;
  return model === "all" ? rows : rows.filter((r) => r.Model === model);
}
function avg(values) {
  const nums = values.map(Number).filter((v) => !Number.isNaN(v));
  if (!nums.length) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}
function render() {
  const active = filteredRows();
  countEl.textContent = `${active.length} rows from ${new Set(active.map((r) => r.Model)).size} model(s)`;
  summaryGrid.innerHTML = "";
  for (const metric of metrics) {
    const value = avg(active.map((r) => r[metric]));
    const wrap = document.createElement("div");
    wrap.className = "metric";
    const pct = value === null ? 0 : (value / 5) * 100;
    wrap.innerHTML = `<div class="metric-head"><span>${metric}</span><strong>${value === null ? "?" : value.toFixed(2)}</strong></div><div class="bar"><span style="width:${pct}%"></span></div>`;
    summaryGrid.appendChild(wrap);
  }
  bodyRows.innerHTML = "";
  for (const row of active) {
    const tr = document.createElement("tr");
    for (const col of columns) {
      const td = document.createElement("td");
      if (col === "Link") {
        const a = document.createElement("a");
        a.href = row[col];
        a.textContent = row[col];
        td.appendChild(a);
      } else {
        td.textContent = row[col];
      }
      if (metrics.includes(col)) td.className = "num";
      tr.appendChild(td);
    }
    bodyRows.appendChild(tr);
  }
}
select.addEventListener("change", render);
render();
